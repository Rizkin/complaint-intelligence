version: 2

models:
  - name: fct_complaint
    description: One row per in-scope complaint (checking/savings and credit card, 2024 onward) from the replay feed.
    columns:
      - name: complaint_id
        data_tests: [unique, not_null]
      - name: date_received
        data_tests: [not_null]
      - name: arrival_date
        data_tests: [not_null]
      - name: product
        data_tests:
          - accepted_values:
              arguments:
                values: ["Checking or savings account", "Credit card"]
      - name: company_response
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Closed with explanation
                  - Closed with monetary relief
                  - Closed with non-monetary relief
                  - In progress
                  - Untimely response
      - name: entity_role
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [customer, peer, peer_history, credit_bureau, credit_union, fintech, processor, unmapped]
      - name: fdic_cert
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_institution')
                field: fdic_cert

  - name: dim_institution
    description: Customer and peer banks (FDIC charters) with their latest reported assets.
    columns:
      - name: fdic_cert
        data_tests: [unique, not_null]
      - name: institution_name
        data_tests: [not_null]
      - name: role
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [customer, peer, peer_history]
      - name: latest_assets_bn
        data_tests: [not_null]

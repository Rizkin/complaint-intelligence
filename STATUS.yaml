# STATUS.yaml — machine-readable coordination state for LLM agents working on this repo.
# Writers: claude-code (Windows host, WSL2 ~/complaint-intelligence) and zcode (Zai code console). Human: repo owner.
# PROTOCOL (mandatory for every agent):
#   1. git pull --rebase BEFORE reading this file and BEFORE editing anything.
#   2. Claim a task: set its owner + status=in_progress, commit+push STATUS.yaml alone, THEN start work.
#   3. On finish: status=done, add evidence (files, numbers, commit). Push code + STATUS.yaml together.
#   4. Never force-push. On conflict in STATUS.yaml: merge both sides' facts; never drop the other agent's entries.
#   5. Do not edit files under another agent's active claim (see locks). Ask the human instead.
#   6. Facts only. Every "done" needs evidence. Unverified = status: unverified.
#   7. Append to log (newest last). Keep updated_at current (ISO-8601, Asia/Kolkata unless stated).
# Status enum: done | in_progress | pending | blocked | replaced | dropped | unverified
# Owner enum: claude-code | zcode | human | unassigned


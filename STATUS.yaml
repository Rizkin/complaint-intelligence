  pipelines/peer_benchmark.py: "customer vs peers per $1B assets (reads raw + seed; candidate to move into dbt)"
  pipelines/replay.py: "daily arrival replay; idempotent upsert on complaint_id + row_hash; flags --days --until --rerun --reset"
  pipelines/run_daily.sh: "N x (replay 1 day + dbt build)"
  pipelines/replay_status.py: "freshness + late rows in fct"
  pipelines/check_incremental.py: "incremental fct_complaint vs full rebuild diff (exit 1 on diff)"
  dbt:
    project: pipelines/dbt  # run from repo root: uv run dbt build --project-dir pipelines/dbt --profiles-dir pipelines/dbt
    target_schema: analytics
    sources: "main.{feed_complaints, replay_log, fdic_institutions, fdic_financials}"
    models: [stg_complaints, stg_fdic_institutions, stg_fdic_financials, int_complaint_entity, fct_complaint, dim_institution]
    fct_complaint: "incremental delete+insert on complaint_id; watermark = last_loaded_at (NOT date_received)"
    seeds: [entity_map_seed (date-aware cfpb_company -> fdic_cert), company_exclusions (bureaus, credit union, fintechs, processors)]
    tests: "39 nodes PASS (keys, accepted_values, relationships, reconcile feed==fct, XXXX redaction preserved, dates in order, seed ranges non-overlap, exactly one customer)"
  docs: [docs/00-brief.md, docs/00-day0-setup.md, docs/01-data-quality.md (14 issues), docs/plan-changes.md, docs/day-log.md, docs/discovery/README.md]

gotchas:
  - "Git Bash -> `wsl -- bash -c '...'` mangles $VAR, backticks, /mnt paths. Use script files + MSYS_NO_PATHCONV=1."
  - "DuckDB: `days` is a reserved word; don't alias columns as days."
  - "`cmd | head -1` under set -o pipefail kills the producer (BrokenPipe). Capture output first."
  - "Only one writer on data/cfpb.duckdb at a time (replay.py and dbt both write)."
  - "python-dotenv find_dotenv() fails under stdin scripts; use load_dotenv('.env')."

